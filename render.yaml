databases:
  - name: crm-vendas-db
    plan: free
    databaseName: crm_vendas
    user: crm

services:
  - type: web
    name: crm-vendas-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: crm-vendas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: crm-vendas-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: crm-vendas-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: crm-vendas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: crm-vendas-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@crm.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO

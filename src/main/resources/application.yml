spring:
  application:
    name: crm-vendas-receptivo

  # Configurações locais de cada desenvolvedor (senha do banco, segredo do JWT).
  # Esse arquivo NÃO vai para o Git. Use application-local.example.yml como modelo.
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm_vendas}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  # Ao subir, cria as tabelas que faltarem e os dados iniciais (roles, permissões, estágios).
  # Os scripts usam IF NOT EXISTS / ON CONFLICT, então podem rodar sempre sem duplicar nada.
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/dados_iniciais.sql
      encoding: UTF-8

  jpa:
    # O schema é criado pelo script SQL; o Hibernate só confere se as entidades batem com o banco.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  web:
    locale: pt_BR
    locale-resolver: fixed

server:
  # O Render informa a porta pela variável PORT.
  port: ${PORT:${SERVER_PORT:8080}}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  # Endereços do front que podem chamar a API (separados por vírgula).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Admin criado ao subir, se ainda não existir. Em produção, sempre defina ADMIN_PASSWORD.
  admin:
    email: ${ADMIN_EMAIL:admin@crm.com}
    senha: ${ADMIN_PASSWORD:senha123}

# Discador Vonix: cada interesse com telefone vai para a fila de discagem.
# Desligado por padrão. Token e fila ficam no application-local.yml ou em variáveis de ambiente.
vonix:
  habilitado: ${VONIX_HABILITADO:false}
  url: ${VONIX_URL:https://credvalor.api.vonixcc.com.br}
  token: ${VONIX_TOKEN:}
  fila-id: ${VONIX_FILA_ID:}
  # Renitência da Vonix: <vezes>,[intervalo em segundos],[causas]
  retry: ${VONIX_RETRY:3,1800}
  intervalo-sincronizacao-ms: ${VONIX_INTERVALO_MS:300000}
  max-tentativas-envio: ${VONIX_MAX_TENTATIVAS:5}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ibrowse.crm: ${LOG_LEVEL:DEBUG}

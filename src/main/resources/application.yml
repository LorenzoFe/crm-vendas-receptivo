spring:
  application:
    name: crm-vendas-receptivo

  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm_vendas}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/dados_iniciais.sql
      encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  web:
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${PORT:${SERVER_PORT:8080}}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:admin@crm.com}
    senha: ${ADMIN_PASSWORD:senha123}

vonix:
  habilitado: ${VONIX_HABILITADO:false}
  url: ${VONIX_URL:}
  token: ${VONIX_TOKEN:}
  fila-id: ${VONIX_FILA_ID:}
  retry: ${VONIX_RETRY:3,1800}
  intervalo-sincronizacao-ms: ${VONIX_INTERVALO_MS:300000}
  max-tentativas-envio: ${VONIX_MAX_TENTATIVAS:5}

springdoc:
  # Mostra page/size/sort como campos separados no Swagger (em vez de um JSON com sort ["string"]).
  default-flat-param-object: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ibrowse.crm: ${LOG_LEVEL:DEBUG}
